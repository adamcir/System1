name: System1 build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gcc-multilib nasm xorriso mtools dosfstools perl \
            grub-pc-bin grub-common qemu-system-x86

      - name: Compile kernel targets
        run: |
          make modules-32
          make modules-64
          make modules-img-32

      - name: Validate native SMOD modules
        run: make smod-check

      - name: Verify portable kernel boundaries
        run: make check-modularity

      - name: Build boot images
        run: |
          make iso-32
          make iso-64
          make img-32

      - name: Boot floppy and confirm early native SMOD activation
        run: |
          set -eu
          LOG="${RUNNER_TEMP}/system1-floppy-boot.log"
          timeout 20s qemu-system-i386 -m 1M -display none \
            -drive file=build/artifacts/images/system1-img-32.img,format=raw,if=floppy \
            -serial stdio -no-reboot > "$LOG" 2>&1 || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            cat "$LOG"
            exit 1
          fi
          grep -F "Early boot modules activated" "$LOG" || { cat "$LOG"; exit 1; }
          # A working fallback is not enough: prove every .mod was activated.
          for module in com1 cmos picpit vga ps2 fdc; do
            grep -F "${module}.mod" "$LOG" || { cat "$LOG"; exit 1; }
          done
          grep -F "Physical filesystem mounted as root" "$LOG" || { cat "$LOG"; exit 1; }
          grep -F "Starting configured userspace shell" "$LOG" || { cat "$LOG"; exit 1; }
          grep -F "/dev and /proc live" "$LOG" || { cat "$LOG"; exit 1; }

      - name: Ensure removing vga.mod disables video driver
        run: |
          set -eu
          IMG="${RUNNER_TEMP}/system1-no-vga.img"
          LOG="${RUNNER_TEMP}/system1-no-vga.log"
          cp build/artifacts/images/system1-img-32.img "$IMG"
          mdel -i "$IMG" ::/boot/modules/vga.mod
          timeout 20s qemu-system-i386 -m 1M -display none \
            -drive file="$IMG",format=raw,if=floppy \
            -serial stdio -no-reboot > "$LOG" 2>&1 || rc=$?
          if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
            cat "$LOG"
            exit 1
          fi
          if grep -F "smod: /boot/modules/vga.mod" "$LOG" || \
             grep -F "smod: vga.mod" "$LOG"; then
            cat "$LOG"
            echo "VGA driver activated without vga.mod!"
            exit 1
          fi
          grep -F "Physical filesystem mounted as root" "$LOG" || { cat "$LOG"; exit 1; }
          grep -F "Starting configured userspace shell" "$LOG" || { cat "$LOG"; exit 1; }
          grep -F "/dev and /proc live" "$LOG" || { cat "$LOG"; exit 1; }

      - name: Boot i386 and x86_64 GRUB with native SMOD drivers
        run: |
          set -eu
          for arch in i386 x86_64; do
            if [ "$arch" = "i386" ]; then
              qemu=qemu-system-i386
              iso=build/artifacts/images/system1-iso-32.iso
            else
              qemu=qemu-system-x86_64
              iso=build/artifacts/images/system1-iso-x86_64.iso
            fi
            LOG="${RUNNER_TEMP}/system1-${arch}.log"
            # Debug 64-bit exceptions to diagnose any early triple fault.
            if [ "$arch" = "x86_64" ]; then
              timeout 20s "$qemu" -m 64M -display none -cdrom "$iso" \
                -serial stdio -no-reboot -d int,guest_errors \
                -D "$LOG.cpu" > "$LOG" 2>&1 || rc=$?
            else
              timeout 20s "$qemu" -m 64M -display none -cdrom "$iso" \
                -serial stdio -no-reboot > "$LOG" 2>&1 || rc=$?
            fi
            if [ "${rc:-0}" -ne 0 ] && [ "${rc:-0}" -ne 124 ]; then
              cat "$LOG"
              exit 1
            fi
            unset rc
            for module in com1 cmos picpit vga ps2 fdc; do
              grep -F "smod: ${module}.mod" "$LOG" || { cat "$LOG"; tail -n 65 "$LOG.cpu" 2>/dev/null || true; exit 1; }
            done
            grep -F "Physical filesystem mounted as root" "$LOG" || { cat "$LOG"; exit 1; }
            grep -F "Starting configured userspace shell" "$LOG" || { cat "$LOG"; exit 1; }
            if grep -F "Userspace shell unavailable" "$LOG" ||
               grep -F "Userspace shell exited" "$LOG"; then
              cat "$LOG"
              echo "Expected persistent MSh, not kernel fallback or early exit"
              exit 1
            fi
            # Verify visible bytes written by MSh, not just the kernel
            # 'Starting configured userspace shell' progress message.
            grep -F "System/1 by Adava Software" "$LOG" || {
              cat "$LOG"
              echo "MSh startup MOTD was not displayed"
              exit 1
            }
            grep -F "/ > " "$LOG" || {
              cat "$LOG"
              echo "MSh prompt did not appear"
              exit 1
            }
          grep -F "/dev and /proc live" "$LOG" || { cat "$LOG"; exit 1; }
          done

      - name: Check userspace programs
        run: make -C src/userland check
