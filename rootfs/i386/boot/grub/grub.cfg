set timeout=0
set default=0

menuentry "System/1 i386" {
  multiboot2 /boot/kernel.elf
  module2 /boot/rootfs.iso rootfs
  if [ -f /boot/modules/com1.mod ]; then module2 /boot/modules/com1.mod smod:com1.mod; fi
  if [ -f /boot/modules/cmos.mod ]; then module2 /boot/modules/cmos.mod smod:cmos.mod; fi
  if [ -f /boot/modules/picpit.mod ]; then module2 /boot/modules/picpit.mod smod:picpit.mod; fi
  if [ -f /boot/modules/vga.mod ]; then module2 /boot/modules/vga.mod smod:vga.mod; fi
  if [ -f /boot/modules/ps2.mod ]; then module2 /boot/modules/ps2.mod smod:ps2.mod; fi
  if [ -f /boot/modules/fdc.mod ]; then module2 /boot/modules/fdc.mod smod:fdc.mod; fi
  boot
}
